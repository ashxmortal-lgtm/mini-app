name: Scheduler Heartbeat Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record scheduler tick
        run: |
          echo "Scheduler heartbeat started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "No Telegram messages are sent by this test."
